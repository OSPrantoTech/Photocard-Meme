<!DOCTYPE html>
<html lang="en">
<head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-WRVM3594R1"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-WRVM3594R1');
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <title>Photo Card Generator</title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/choices.js/public/assets/styles/choices.min.css" />
    <link rel="stylesheet" href="style.css">
    
    <style>
        /* Mobile Fixes & Responsive Design */
        :root {
            --sidebar-width: 350px;
        }

        body {
            margin: 0;
            overflow-x: hidden;
        }

        .app-container {
            display: flex;
            height: 100vh;
            flex-direction: row;
        }

        /* Sidebar Responsive Styling */
        .sidebar {
            width: var(--sidebar-width);
            height: 100%;
            overflow-y: auto;
            background: #f9fafb;
            z-index: 100;
            transition: transform 0.3s ease;
        }

        .preview-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #f0f2f5;
            padding: 20px;
            overflow: hidden;
        }

        .canvas-wrapper {
            max-width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #renderTarget {
            max-width: 100%;
            height: auto !important; /* Mobile glitch fix */
            aspect-ratio: 1/1;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        /* Neon & Header Styles */
        .neon-title {
            font-size: 20px;
            font-weight: 700;
            color: #fff;
            text-shadow: 0 0 7px #fff, 0 0 21px #ff0055;
            animation: pulse-red 2s infinite alternate;
        }

        .neon-subtitle {
            font-size: 12px;
            color: #fff;
            text-shadow: 0 0 5px #00d4ff;
            animation: pulse-blue 2s infinite alternate;
        }

        @keyframes pulse-red { from { opacity: 0.8; } to { opacity: 1; } }
        @keyframes pulse-blue { from { opacity: 0.7; } to { opacity: 1; } }

        .sidebar-header {
            padding: 15px;
            background: #111;
            border-bottom: 1px solid #333;
        }

        /* Mobile View (Glitch Fixes) */
        @media (max-width: 768px) {
            .app-container {
                flex-direction: column;
            }

            .sidebar {
                position: fixed;
                left: 0;
                bottom: 0;
                width: 100%;
                height: 70vh;
                transform: translateY(100%); /* Hidden by default */
                box-shadow: 0 -5px 25px rgba(0,0,0,0.2);
                border-radius: 20px 20px 0 0;
            }

            .sidebar.active {
                transform: translateY(0);
            }

            .mobile-toggle {
                display: flex !important;
                position: fixed;
                bottom: 20px;
                right: 20px;
                z-index: 1000;
                background: #ff0055;
                color: white;
                padding: 12px 20px;
                border-radius: 50px;
                border: none;
                align-items: center;
                gap: 8px;
                box-shadow: 0 4px 15px rgba(255, 0, 85, 0.4);
            }

            .preview-area {
                height: 100vh;
                padding: 10px;
            }

            #renderTarget {
                width: 90vw !important;
                height: 90vw !important;
            }
        }

        .mobile-only { display: none; }
        @media (max-width: 768px) { .mobile-only { display: block; } }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/choices.js/public/assets/scripts/choices.min.js"></script>
</head>
<body>
    <div class="app-container">
        <button id="toggleSettings" class="mobile-toggle" onclick="document.querySelector('.sidebar').classList.toggle('active')">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"/>
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1Z"/>
            </svg>
            Edit Tools
        </button>

        <aside class="sidebar">
            <div class="sidebar-header">
                <div style="display: flex; justify-content: space-between; align-items: flex-start;">
                    <div>
                        <h1 class="neon-title">Photo Card</h1>
                        <p class="neon-subtitle">OSPranto Tech</p>
                    </div>
                    <button onclick="document.querySelector('.sidebar').classList.remove('active')" class="mobile-only" style="background:none; border:none; color:white; font-size:30px;">&times;</button>
                </div>
            </div>
            
            <div class="controls" style="padding: 20px;">
                <div class="control-group">
                    <label>Select Template</label>
                    <select id="templateSelect"></select>
                </div>
                <div id="dynamicContent"></div>
                
                <div class="actions" style="margin-top: 20px; display: flex; flex-direction: column; gap: 10px;">
                    <button id="downloadBtn" class="primary-btn" style="width: 100%; padding: 15px; background: #ff0055; color: white; border: none; border-radius: 8px; font-weight: bold;">Download Image</button>
                    <button id="resetBtn" class="secondary-btn" style="width: 100%; padding: 10px; border: 1px solid #ccc; background: none; border-radius: 8px;">Reset</button>
                </div>
            </div>
        </aside>
        
        <main class="preview-area">
            <div class="canvas-wrapper">
                <div id="renderTarget">
                    </div>
            </div>
            <p style="font-size: 12px; color: #666; margin-top: 10px;">Preview matches output (1080x1080)</p>
        </main>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
